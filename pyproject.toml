[project]
name = "sunday-brief"
version = "0.1.0"
description = "Weekly family calendar digest for a home Mac Mini, delivered via Pushover."
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "icalendar>=5.0",
    "recurring-ical-events>=2.2",
    "feedparser>=6.0",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
    "anthropic>=0.40",
    "beautifulsoup4>=4.12",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
