# Your live config. Start with just your own two calendars; add your spouse's
# once this works. Secret iCal URLs go in .env (referenced by `secret:` below),
# never here — so this file is safe to commit and sync to the Mini.

window_days: 7

summary:
  style: narrative
  model: claude-sonnet-5
  names:                    # used by narrative mode to write in 3rd person
    me: Justin
    spouse: Maria
  children:                 # age_months as of `as_of`; current age is computed
    - name: ChildA          # fresh every run, so it never needs manual updates
      age_months: 48
      as_of: "2026-09-02"
    - name: ChildB
      age_months: 18
      as_of: "2026-09-02"

sources:
  # ---- You (start here) -------------------------------------------------
  - name: "My work"
    type: ical
    category: work
    person: me
    secret: ICAL_ME_WORK
  - name: "My personal"
    type: ical
    category: personal
    person: me
    secret: ICAL_ME_PERSONAL

  # ---- Spouse (uncomment once yours works) ------------------------------
  - name: "Spouse — work"
    type: ical
    category: work
    person: spouse
    secret: ICAL_SPOUSE_WORK
  - name: "Spouse — personal"
    type: ical
    category: personal
    person: spouse
    secret: ICAL_SPOUSE_PERSONAL

    # ---- Daycare ----------------------------------------------------------
  - name: "Brightwheel (ChildA)"
    type: ical
    category: daycare
    child: ChildA
    secret: ICAL_BRIGHTWHEEL

  # ---- Local (weekend/extracurricular picks) -----------------------------
  - name: "Millburn Library"
    type: ical
    category: local
    url: "https://millburnlibrary.libcal.com/ical_subscribe.php?cid=6309"
  - name: "Maplewood Library"
    type: libnet-events
    category: local
    url: "https://maplewoodlibrary.libnet.info"
  - name: "Pallet Brewing"
    type: mec-events
    category: local
    url: "https://palletbrewing.com/eventscal/"
  - name: "Village Green"
    type: cityspark-events
    category: local
    url: "https://portal.cityspark.com/PortalScripts/VillageGreenNJ"
  - name: "Maplewood Online"
    type: worldwebs-events
    category: local
    url: "https://maplewoodonline.com/calendar/"

  # More local sources come later — see config/sources.example.yaml for the
  # full menu of source types.
